})(AIVA);

const lanes = [151,305,455];
// Each pair selects a lane and an item. Index zero is the requested item.
// The empty row before it gives the player time to cross the road.
const rows = [
  [[0,1],[2,3]], [[1,5]], [[0,6],[1,2]], [],
  [[2,0]], [[1,7],[2,9]], [[0,4],[2,8]], []
];
const rowSpacing = 158, loopLength = rows.length * rowSpacing;
const startY = -135, driverY = 465;
let driverX = lanes[1], travel = 0, lastFrame = null, phase = 'play';
const road = $('road'), driver = $('driver');
let previousTheme;
const objects = rows.flatMap((row,index) => row.map(([lane,type]) => {
  const card = document.createElement('div');
  card.className = 'fruit';
  const img = new Image();
  card.append(img); $('fruit-stream').append(card);
  return {card,img,type,x:lanes[lane],offset:index*rowSpacing};
}));
function chooseTheme() {
  const choices = themes.filter(theme => theme !== previousTheme);
  const theme = choices[Math.floor(Math.random() * choices.length)];
  previousTheme = theme;
  const target = theme.items[0].name;
  $('search-lead').textContent = 'AIVA, search for ' + theme.article;
  $('search-item').textContent = target.toUpperCase();
  $('search-purpose').textContent = theme.purpose.toUpperCase();
  road.setAttribute('aria-label', 'Drive AIVA left or right to collect the ' +
    target.toLowerCase() + '. Use the pointer or arrow keys.');
  for (const object of objects) {
    const item = theme.items[object.type];
    object.img.src = item.image;
    object.img.alt = item.name;
  }
}
function steer(x) {
  driverX = Math.max(144, Math.min(460,x));
  driver.style.left = driverX+'px';
}
function follow(event) {
  if (phase !== 'play') return;
  const bounds = road.getBoundingClientRect();
  steer((event.clientX-bounds.left)*600/bounds.width);
}
AIVA.world.addEventListener('pointermove',follow);
road.addEventListener('pointerdown',event => {road.setPointerCapture(event.pointerId); follow(event)});
road.addEventListener('keydown',event => {
  if (phase==='play' && ['ArrowLeft','ArrowRight'].includes(event.key)) {
    event.preventDefault(); steer(driverX+(event.key==='ArrowLeft'?-20:20));
  }
});
function placeObjects() {
  for (const item of objects) {
    const distance = travel-item.offset;
    // Wait for the first pass before wrapping. A new pass starts above the viewport.
    const y = startY+(distance < 0 ? distance : distance % loopLength);
    item.y = y;
    item.card.hidden = y < -38 || y > 578;
    item.card.style.transform = `translate(${item.x-38}px,${y-38}px)`;
  }
}
function finish(item) {
  phase='collected';
  item.card.hidden=true;
  effects.sparkle({x:item.x,y:item.y});
  setTimeout(() => {
    phase='complete'; game.hidden=true; $('learning-layer').hidden=false;
    $('retry').focus();
  },950);
}
function frame(time) {
  if (phase!=='play') return;
  const seconds = lastFrame===null ? 0 : Math.min((time-lastFrame)/1000,0.05);
  lastFrame=time;
  travel += seconds*(reduced.matches ? 98 : 140);
  placeObjects();
  const hit=objects.find(item => Math.abs(driverX-item.x)<49 && Math.abs(driverY-item.y)<48);
  if (hit) {
    if (hit.type===0) {finish(hit);return}
    travel=0;placeObjects();
  }
  requestAnimationFrame(frame);
}
function start() {
  chooseTheme();
  phase='play';lastFrame=null;travel=0;effects.clear();
  game.hidden=false;$('learning-layer').hidden=true;
  steer(lanes[1]);placeObjects();requestAnimationFrame(frame);
}
$('retry').addEventListener('click',()=>{start();road.focus({preventScroll:true})});
start();
