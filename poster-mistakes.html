(function(A){

 const random=crypto.getRandomValues(new Uint32Array(1))[0];let index=random%A.posterRounds.length;if(index===previous)index=(index+1)%A.posterRounds.length;previous=index;round=A.posterRounds[index];A.world.dataset.round=round.id;$('brief-text').textContent=round.message;
