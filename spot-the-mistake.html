 const overrides={zh:{},ms:{},ta:{}};

 const cache={zh:new Map(),ms:new Map(),ta:new Map()};
 const source=new WeakMap();            // text node -> its English text
 const waiting=new Set();               // text nodes awaiting a translation, kept hidden meanwhile
 const engines={};                      // lang -> Translator | null
 const ours=new Set();                  // text nodes this module just wrote, so the observer ignores them
 let current='en',observer=null,pending=new Set(),flush=null;

 const skip=node=>{
  const p=node.parentElement;
  if(!p||!/\S/.test(node.nodeValue))return true;
  if(p.tagName==='SCRIPT'||p.tagName==='STYLE')return true;
  return !!p.closest('[data-no-translate]');
 };
 function collect(root,out){
  if(root.nodeType===3){if(!skip(root))out.push(root);return out}
  if(root.nodeType!==1)return out;
  const walk=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
  for(let n=walk.nextNode();n;n=walk.nextNode())if(!skip(n))out.push(n);
  return out;
 }

 /* Hide the holder of an untranslated string without collapsing the layout box. */
 function veil(node){
  waiting.add(node);
  const el=node.parentElement;
  if(el)el.classList.add('i18n-pending');
 }
 function unveil(node){
  waiting.delete(node);
  const el=node.parentElement;
  if(el&&![...el.childNodes].some(n=>waiting.has(n)))el.classList.remove('i18n-pending');
 }
 function unveilAll(){
  for(const node of [...waiting])unveil(node);
  waiting.clear();
  for(const el of document.querySelectorAll('.i18n-pending'))el.classList.remove('i18n-pending');
 }
 function write(node,value){ours.add(node);node.nodeValue=value}

 async function engineFor(lang){
  if(lang in engines)return engines[lang];
  engines[lang]=null;
  const T=self.Translator;
  if(!T||!T.create)return null;
  try{
   const state=await T.availability({sourceLanguage:'en',targetLanguage:lang});
   if(state==='unavailable')return null;
   engines[lang]=await T.create({sourceLanguage:'en',targetLanguage:lang,monitor(m){
    m.addEventListener('downloadprogress',e=>A.i18n.onstatus(lang,'downloading',e.loaded));
   }});
  }catch(error){console.warn('[i18n] no translator for '+lang,error);engines[lang]=null}
  return engines[lang];
 }

 async function render(text,lang){
  const key=text.trim();
  if(!key)return null;
  if(overrides[lang]&&overrides[lang][key])return overrides[lang][key];
  if(cache[lang].has(key))return cache[lang].get(key);
  const engine=await engineFor(lang);
  if(!engine)return null;
  try{
   const out=await engine.translate(key);
   cache[lang].set(key,out);
   return out;
  }catch(error){console.warn('[i18n] translate failed',error);return null}
 }

 async function apply(nodes,lang){
  for(let i=0;i<nodes.length;i++){
   const node=nodes[i];
   if(current!==lang){for(const rest of nodes.slice(i))unveil(rest);return}   // language changed underneath us
   if(!node.isConnected){unveil(node);continue}
   if(!source.has(node))source.set(node,node.nodeValue);
   const english=source.get(node);
   if(lang==='en'){write(node,english);unveil(node);continue}
   const key=english.trim();
   const cached=overrides[lang][key]||cache[lang].get(key);
   const out=cached||await render(english,lang);
   if(node.isConnected&&out)write(node,english.replace(key,out));
   unveil(node);
  }
  relayout();
 }

 /* Text set by the games is measured after it is written, so re-measure once it changes. */
 function relayout(){
  const bubble=A.$&&A.$('question-message');
  if(bubble&&A.spaceBubble&&bubble.offsetParent)A.spaceBubble(bubble);
  const reference=A.$&&A.$('reference-text');
  if(reference&&A.spaceBubble&&reference.offsetParent)A.spaceBubble(reference);
  A.i18n.onapplied();
 }

 function queue(nodes){
  if(current==='en'||!nodes.length)return;
  for(const n of nodes){veil(n);pending.add(n)}
  clearTimeout(flush);
  flush=setTimeout(()=>{const batch=[...pending];pending.clear();apply(batch,current)},0);
 }

 function watch(root){
  if(observer)return;
  observer=new MutationObserver(records=>{
   const found=[];
   for(const record of records){
    if(record.type==='characterData'){
     const node=record.target;
     if(ours.has(node)){ours.delete(node);continue}   // our own write, not new English
     if(!skip(node)){source.delete(node);found.push(node)}
    }else for(const node of record.addedNodes)collect(node,found);
   }
   queue(found);
  });
  observer.observe(root,{childList:true,subtree:true,characterData:true});
 }

 A.i18n={
  langs:LANGS,
  overrides,
  get current(){return current},
  onstatus(){},                          // config.js replaces this
  onapplied(){},
  supported:async lang=>lang==='en'||!!Object.keys(overrides[lang]||{}).length||!!await engineFor(lang),
  async set(lang){
   if(!LANGS[lang]||lang===current)return;
   const root=A.world||document.body;
   watch(root);
   pending.clear();clearTimeout(flush);unveilAll();
   const nodes=collect(root,[]);
   current=lang;A.lang=lang;document.documentElement.lang=lang;
   if(lang!=='en'){
    A.i18n.onstatus(lang,'working');
    for(const n of nodes)veil(n);
   }
   await apply(nodes,lang);
   A.i18n.onstatus(lang,lang==='en'?'idle':(engines[lang]||Object.keys(overrides[lang]||{}).length?'done':'unsupported'));
  }
 };
 A.lang='en';
})(AIVA);

;
/* Fullscreen gate and configuration screen.
   While the page is not fullscreen the whole screen goes black and shows how to
   enter fullscreen, plus the language picker. Load this LAST: it appends itself
   to <body> after A.mount() has replaced the body markup. */
(function(A){
 'use strict';

 const ENABLE_CONFIG_GATE=true;      // false disables the fullscreen gate and this screen entirely
 const ENABLE_LANGUAGE_PICKER=false; // false hides the language picker but keeps the fullscreen gate

 if(!ENABLE_CONFIG_GATE)return;

 const overlay=document.createElement('section');
 overlay.id='config-gate';
 overlay.dataset.noTranslate='';
 overlay.setAttribute('aria-label','Setup');
 overlay.innerHTML=`<div class="config-inner">

  <p class="config-lead">This game needs the whole screen.</p>
  <button id="config-fullscreen" class="config-primary" type="button">Enter fullscreen</button>
  <p class="config-hint">…or press <kbd>F</kbd> or <kbd>F11</kbd>. Press <kbd>Esc</kbd> to come back here.</p>
  <div id="config-language">
   <h2 class="config-subtitle">Language</h2>
   <div id="config-langs" class="config-langs" role="group" aria-label="Language"></div>
   <p id="config-status" class="config-status" role="status" aria-live="polite"></p>
   <p class="config-note">Language resets to English when the page is refreshed.</p>
  </div>
 </div>`;
 document.body.append(overlay);

 const status=overlay.querySelector('#config-status');
 const buttons=new Map();

 if(!ENABLE_LANGUAGE_PICKER)overlay.querySelector('#config-language').remove();

 for(const [code,label] of ENABLE_LANGUAGE_PICKER?Object.entries(A.i18n.langs):[]){
  const b=document.createElement('button');
  b.type='button';b.className='config-lang';b.dataset.lang=code;b.textContent=label;
  b.setAttribute('aria-pressed',String(code===A.i18n.current));
  b.addEventListener('click',async()=>{
   if(b.disabled)return;
   for(const other of buttons.values())other.disabled=true;
   await A.i18n.set(code);
   for(const [other,el] of buttons)el.disabled=false,el.setAttribute('aria-pressed',String(other===A.i18n.current));
  });
  buttons.set(code,b);
  overlay.querySelector('#config-langs').append(b);
 }

 A.i18n.onstatus=(lang,state,loaded)=>{
  if(!status.isConnected)return;
  const name=A.i18n.langs[lang]||lang;
  if(state==='idle')status.textContent='';
  else if(state==='downloading')status.textContent='Downloading the '+name+' language pack… '+Math.round((loaded||0)*100)+'%';
  else if(state==='working')status.textContent='Translating to '+name+'…';
  else if(state==='done')status.textContent=name+' ready.';
  else status.textContent=name+' is not available on this browser — staying in English. Add the strings to shared/i18n.js to ship it offline.';
 };

 overlay.querySelector('#config-fullscreen').addEventListener('click',()=>{
  document.documentElement.requestFullscreen?.().catch(()=>{
   if(status.isConnected)status.textContent='This browser blocked fullscreen. Press F11 instead.';
  });
 });

 // F11 and kiosk mode do not set document.fullscreenElement, so also compare against the screen.
 const filled=()=>innerWidth>=screen.width-2&&innerHeight>=screen.height-2;
 const isFullscreen=()=>!!document.fullscreenElement||filled();

 function sync(){
  const on=isFullscreen();
  overlay.hidden=on;
  document.body.classList.toggle('config-open',!on);
  if(A.world)A.world.inert=!on;
 }
 addEventListener('resize',sync);
 addEventListener('focus',sync);
 document.addEventListener('fullscreenchange',sync);
 sync();

 A.configGate={sync,isFullscreen,overlay};
})(AIVA);

</script>
</body></html>
